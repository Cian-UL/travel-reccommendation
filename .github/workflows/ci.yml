name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_project_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travel_project_database"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Run the test suite
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/travel_project_database
          DB_PASSWORD: postgres
          OPENTRIPMAP_KEY: dummy-key-for-ci
          LITEAPI_KEY: dummy-key-for-ci
        run: ./mvnw test -B