<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Search Results</title></head>
<body>
<h1>Affordable Destinations</h1>

<div th:if="${#lists.isEmpty(searchResults)}">
    <p><strong>No destinations within your budget. Try increasing it!</strong></p>
</div>

<div th:if="${!#lists.isEmpty(searchResults)}">
    <div th:each="result : ${searchResults}" style="margin-bottom: 20px; padding: 10px; border: 1px solid #ccc;">
        <h2 th:text="${result.destination.cityName + ', ' + result.destination.countryName}"></h2>
        <p><strong>Flights:</strong> €<span th:text="${result.flightCost}"></span></p>
        <p><strong>Hotels:</strong> €<span th:text="${result.hotelCost}"></span></p>
        <p><strong>Food/Transport:</strong> €<span th:text="${result.dailyCost}"></span></p>
        <hr>
        <p><strong>Total Cost:</strong> €<span th:text="${result.totalCost}"></span></p>
    </div>
</div>

<br><a th:href="@{/}">Search Again</a>
</body>
</html>
